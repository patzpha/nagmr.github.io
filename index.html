<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#000"><title>Nag°MR</title><style>
:root{--c:rgba(30,30,38,.72);--d:#aaa7b5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

p{margin:0;color:var(--d);font-size:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--d)}
label b{color:#fff}
label.k{flex-direction:row;align-items:center;gap:10px;color:#fff}
input[type=range]{width:100%;accent-color:#8b7cf6}
select,button{font:inherit;padding:12px;border-radius:99px;background:var(--c);color:#fff;border:0}
#go{background:#fff;color:#16141c;font-weight:700}
.row{display:flex;gap:10px}.row button{flex:1}
</style></head><body>
<canvas id="c"></canvas><video id="v" playsinline muted autoplay></video><pre id="diag"></pre>
<button id="gear">⚙</button>
<main id="menu"><h1>Nag°MR</h1>
<p>Home em realidade mista para óculos VR Box. Coloque o celular nos óculos depois de tocar em Entrar.</p>
<div id="opts"></div>
<label>Resolução da câmera<select id="q"><option value="4k">4K</option><option value="hd">Full HD</option></select></label>
<label class="k"><input type="checkbox" id="dg">Mostrar diagnóstico</label>
<label class="k"><input type="checkbox" id="hd">Rastrear mão</label>
<div class="row"><button id="rc">Recentralizar</button><button id="rs">Recolocar ícones</button></div>
<button id="go">Entrar</button>
<p>Pinça ou punho fechado sobre um app para pegar. Pinça rápida abre o app. Sem mão: olhe para o app e toque na tela.</p></main>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script>
'use strict';
const $=s=>document.querySelector(s),V3=THREE.Vector3,P2=Math.PI*2;
THREE.ColorManagement.enabled=false;
const D={ipd:64,fov:75,k1:.22,k2:.08,sep:0,hs:.6,q:'4k',diag:true,hand:true};
try{Object.assign(D,JSON.parse(localStorage.VSMR2||'{}'))}catch(e){}
const save=()=>{try{localStorage.VSMR2=JSON.stringify(D)}catch(e){}};
[['ipd','Distância entre os olhos (mm)',50,80,1],['fov','Campo de visão (°)',50,110,1],['k1','Correção de lente k1',0,.6,.01],['k2','Correção de lente k2',0,.4,.01],['sep','Afastar centros das lentes',-.15,.15,.005],['hs','Tamanho da mão virtual',.2,1.5,.05]].forEach(([k,l,a,b,s])=>{
const r=document.createElement('label');
r.innerHTML='<span>'+l+': <b>'+D[k]+'</b></span><input type="range" min="'+a+'" max="'+b+'" step="'+s+'">';
const i=r.querySelector('input'),o=r.querySelector('b');i.value=D[k];
i.oninput=()=>{D[k]=+i.value;o.textContent=i.value;save()};$('#opts').append(r)});
$('#q').value=D.q;$('#dg').checked=D.diag;$('#hd').checked=D.hand;
$('#q').onchange=e=>{D.q=e.target.value;save();if(camStarted)startCam()};
$('#dg').onchange=e=>{D.diag=e.target.checked;save()};
$('#hd').onchange=e=>{D.hand=e.target.checked;save()};

/* renderer */
const cv=$('#c'),video=$('#v'),R=new THREE.WebGLRenderer({canvas:cv,antialias:false});
R.outputColorSpace=THREE.LinearSRGBColorSpace;R.autoClear=false;R.setPixelRatio(1);
let PW=1,PH=1,rt=null;
const LF=THREE.LinearFilter,bgC=new THREE.Camera();
const VS='varying vec2 v;void main(){v=uv;gl_Position=vec4(position.xy,0.,1.);}';
const quad=(fs,u)=>{const m=new THREE.ShaderMaterial({depthTest:false,depthWrite:false,uniforms:u,vertexShader:VS,fragmentShader:fs}),q=new THREE.Mesh(new THREE.PlaneGeometry(2,2),m),s=new THREE.Scene();q.frustumCulled=false;s.add(q);return[s,m]};
const vtex=new THREE.VideoTexture(video);vtex.minFilter=vtex.magFilter=LF;
const[bgS,bgM]=quad('uniform sampler2D t;uniform vec2 s;varying vec2 v;void main(){gl_FragColor=vec4(texture2D(t,.5+(v-.5)*s).rgb,1.);}',{t:{value:vtex},s:{value:new THREE.Vector2(1,1)}});
const[ds,dm]=quad(`uniform sampler2D t;uniform vec2 k;uniform float sep,asp;varying vec2 v;
void main(){float e=step(.5,v.x);vec2 l=vec2((v.x-.5*e)*2.,v.y);float c=.5+(1.-2.*e)*sep;
vec2 p=(l-vec2(c,.5))*2.;p.x*=asp;float r=dot(p,p);p*=1.+k.x*r+k.y*r*r;p.x/=asp;
vec2 q=p*.5+vec2(c,.5);
if(q.x<0.||q.x>1.||q.y<0.||q.y>1.){gl_FragColor=vec4(0.,0.,0.,1.);return;}
gl_FragColor=vec4(texture2D(t,vec2(q.x*.5+.5*e,q.y)).rgb,1.);}`,{t:{value:null},k:{value:new THREE.Vector2()},sep:{value:0},asp:{value:1}});
function resize(){const pr=Math.min(devicePixelRatio||1,1.5);PW=Math.max(2,innerWidth*pr|0);PH=Math.max(2,innerHeight*pr|0);R.setSize(PW,PH,false);if(rt)rt.dispose();rt=new THREE.WebGLRenderTarget(PW,PH,{minFilter:LF,magFilter:LF,depthBuffer:true});dm.uniforms.t.value=rt.texture}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,300));resize();

/* cena */
const scene=new THREE.Scene(),head=new THREE.Object3D();scene.add(head);
const E=[0,1].map(()=>new THREE.PerspectiveCamera(75,1,.05,50));E.forEach(c=>head.add(c));
const hs=new THREE.Scene(),HC=new THREE.PerspectiveCamera(75,1,.01,10);
function mk(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');f&&f(x);const t=new THREE.CanvasTexture(c);t.minFilter=t.magFilter=LF;t.generateMipmaps=false;return{x,t}}
const pl=(w,h,t)=>new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false}));
const rr=(x,a,b,w,h,r,f)=>{x.beginPath();x.roundRect(a,b,w,h,r);x.fillStyle=f;x.fill()};

/* ícones SVG */
const S=(a,w=7)=>`stroke="#fff" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" fill="none" ${a}`;
const G={
Explore:`<circle cx="50" cy="50" r="36" ${S('')}/><path d="M66 34 55 55 34 66 45 45Z" fill="#fff"/>`,
'File Viewer':`<rect x="16" y="22" width="68" height="56" rx="9" ${S('',6)}/><circle cx="36" cy="40" r="6" fill="#fff"/><path d="M20 72 42 52 56 64 66 54 82 70" ${S('',5)}/>`,
Scoreboards:`<rect x="20" y="52" width="16" height="28" rx="3" fill="#fff"/><rect x="42" y="28" width="16" height="52" rx="3" fill="#fff"/><rect x="64" y="42" width="16" height="38" rx="3" fill="#fff"/>`,
Files:`<path d="M14 30h26l8 10h38v40H14Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>`,
Browser:`<circle cx="50" cy="50" r="37" ${S('')}/><path d="M66 34 55 55 34 66 45 45Z" fill="#fff"/>`,
'First Steps':`<ellipse cx="38" cy="38" rx="11" ry="17" fill="#fff"/><ellipse cx="62" cy="64" rx="11" ry="17" fill="#fff"/>`,
Store:`<path d="M22 36h56l-4 46H26Z" fill="#fff"/><path d="M36 44V32a14 14 0 0 1 28 0v12" ${S('',6)}/>`,
'Gorilla Jumping':`<circle cx="50" cy="48" r="31" fill="#fff"/><circle cx="38" cy="47" r="5" fill="#2a3a22"/><circle cx="62" cy="47" r="5" fill="#2a3a22"/>`,

'YouTube VR':`<rect x="12" y="26" width="76" height="48" rx="15" fill="#f00"/><path d="M43 38 65 50 43 62Z" fill="#fff"/>`,
'Gravity Sketch':`<path d="M18 72Q38 18 54 50T84 28" ${S('',7)}/>`,
Daydream:`<path d="M50 50a6 6 0 0 1 12 0a14 14 0 0 1-28 0a22 22 0 0 1 44 0a30 30 0 0 1-60 0" ${S('',6)}/>`,
QuestCraft:`<path d="M22 34Q50 10 78 34" ${S('',10)}/><path d="M50 22V82" stroke="#5a3a1a" stroke-width="10" stroke-linecap="round"/>`,
'Roblox VR':`<g transform="rotate(15 50 50)"><rect x="22" y="22" width="56" height="56" rx="9" fill="#fff"/><rect x="41" y="41" width="18" height="18" rx="3" fill="#2a3cd8"/></g>`,
VRidge:`<path d="M50 16 84 42 50 84 16 42Z" fill="#fff"/><path d="M16 42h68" stroke="#1a60c0" stroke-width="3"/>`,
Pessoas:`<circle cx="50" cy="34" r="14" fill="#fff"/><path d="M22 82q0-30 28-30t28 30Z" fill="#fff"/>`,
Share:`<path d="M20 78V60Q20 40 44 40h22V24L90 48 66 72V56H44Q30 56 30 78Z" fill="#fff" transform="scale(.85) translate(6 4)"/>`};
const SVG=(b,f)=>{const i=new Image();i.onload=f;i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">'+b+'</svg>');return i};

/* painel "Apps" (fundo) */
const PN=mk(1200,896,x=>{
rr(x,0,0,1200,896,44,'rgba(32,32,36,.93)');
x.strokeStyle='rgba(255,255,255,.1)';x.lineWidth=3;x.beginPath();x.roundRect(2,2,1196,892,44);x.stroke();
x.fillStyle='#fff';x.font='600 36px system-ui';x.textBaseline='middle';x.fillText('Apps',44,64);
rr(x,560,32,64,64,32,'rgba(255,255,255,.1)');
x.strokeStyle='#fff';x.lineWidth=5;x.lineCap='round';x.beginPath();x.arc(588,62,13,0,P2);x.moveTo(598,72);x.lineTo(608,82);x.stroke();
[[650,'Recentes',220],[890,'Todo (16)',270]].forEach(([a,t,w])=>{rr(x,a,32,w,64,32,'rgba(255,255,255,.1)');x.fillStyle='#fff';x.font='500 28px system-ui';x.fillText(t,a+30,64);
x.strokeStyle='#fff';x.lineWidth=4;x.beginPath();x.moveTo(a+w-48,58);x.lineTo(a+w-38,68);x.lineTo(a+w-28,58);x.stroke()});
x.fillStyle='rgba(18,18,22,.95)';x.beginPath();x.roundRect(0,812,1200,84,[0,0,44,44]);x.fill();
x.strokeStyle='#fff';x.lineWidth=4;x.beginPath();x.moveTo(36,842);x.lineTo(60,866);x.moveTo(60,842);x.lineTo(36,866);x.moveTo(92,854);x.lineTo(114,854);x.stroke();
x.fillStyle='#ddd';x.font='500 26px system-ui';x.textAlign='center';x.fillText('Biblioteca',600,854)});
const winP=new THREE.Group();winP.position.set(0,.1,-1.6);scene.add(winP);
const panel=pl(1.5,1.12,PN.t);panel.renderOrder=0;winP.add(panel);
const HT=mk(260,28,x=>rr(x,0,2,260,24,12,'#fff'));
const handles=[];
const mkHandle=(par,y)=>{const h=pl(.26,.028,HT.t);h.renderOrder=4;h.position.set(0,y,.02);h.userData={handle:1,win:par,r:.13,s:1,name:'alça'};par.add(h);handles.push(h);return h};
mkHandle(winP,-.6);

/* tiles de apps */
const APPS=[['Explore','#2bb6d8','#2a6fe0'],['File Viewer','#7bc043','#2a9d8f'],['Scoreboards','#1b1b6b','#0d3b66'],['Files','#17b3a8','#0f7fa8'],
['Browser','#4fa8ff','#2574e9'],['First Steps','#4a2a9a','#d02a6a'],['Store','#ffb36b','#e98445'],['Gorilla Jumping','#7c9f60','#4d6945'],
['CINEVR','#9d68ff','#6346e8'],['Beat Saber','#8a1f3a','#2a1030'],['YouTube VR','#ffffff','#f1f1f1','#111'],['Gravity Sketch','#4a4d54','#25272c'],
['Daydream','#42d9ff','#4b8df5'],['QuestCraft','#79bf45','#6a8e38'],['Roblox VR','#5579ee','#2851c8'],['VRidge','#55a8ff','#2565c0']];
const GLW=mk(360,230,x=>{x.fillStyle='rgba(255,255,255,.22)';x.strokeStyle='#fff';x.lineWidth=9;x.beginPath();x.roundRect(8,8,344,214,40);x.fill();x.stroke()});
const items=[];
APPS.forEach(([n,c1,c2,tc],i)=>{
const T=mk(512,310,x=>{
x.save();x.beginPath();x.roundRect(0,0,512,310,40);x.clip();
const g=x.createLinearGradient(0,0,512,310);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;x.fillRect(0,0,512,310);
const s=x.createLinearGradient(0,0,0,310);s.addColorStop(0,'rgba(255,255,255,.18)');s.addColorStop(.5,'rgba(255,255,255,0)');x.fillStyle=s;x.fillRect(0,0,512,310);x.restore()});
const draw=()=>{const x=T.x;x.drawImage(im,28,75,160,160);x.textAlign='left';x.textBaseline='middle';x.font='600 44px system-ui';x.fillStyle=tc||'#fff';
x.shadowColor=tc?'transparent':'rgba(0,0,0,.45)';x.shadowBlur=6;x.fillText(n,196,155,296);x.shadowBlur=0;T.t.needsUpdate=true};
const im=SVG(G[n],draw);
const g=new THREE.Group(),glow=pl(.352,.222,GLW.t),m=pl(.33,.2,T.t);
glow.position.z=-.004;glow.material.opacity=0;glow.renderOrder=2;m.renderOrder=3;g.add(glow,m);
const c=i%4,r=i/4|0;
g.userData={name:n,gl:glow,home:new V3((c-1.5)*.345,.30-r*.21,.01),s:1,r:.15};
g.position.copy(g.userData.home);winP.add(g);items.push(g)});
const resetItems=()=>{items.forEach(g=>g.position.copy(g.userData.home));winP.position.set(0,.1,-1.6);winP.quaternion.identity();dockW.position.set(0,-.66,-1.55);dockW.quaternion.identity()};

/* dock inferior */
const K=mk(900,130),dockW=new THREE.Group(),dock=pl(.9,.13,K.t);dockW.position.set(0,-.66,-1.55);scene.add(dockW);dock.renderOrder=1;dockW.add(dock);mkHandle(dockW,-.1);
const DK=[['Explore','#2d7fe8'],['Store','#f0902f'],['Pessoas','#a05ad8'],['Share','#f0507a']].map(([n,c])=>[SVG(G[n],drawDock),c]);
function drawDock(){const x=K.x,d=new Date(),z=n=>String(n).padStart(2,'0');
x.clearRect(0,0,900,130);rr(x,6,6,888,118,34,'rgba(32,32,36,.93)');
x.fillStyle='#fff';x.textBaseline='middle';x.textAlign='left';x.font='500 30px system-ui';x.fillText(d.getHours()+':'+z(d.getMinutes()),36,48);
x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.roundRect(36,80,36,18,4);x.stroke();rr(x,40,84,24,10,2,'#fff');
x.lineWidth=3.5;x.lineCap='round';[8,15,22].forEach(r=>{x.beginPath();x.arc(120,100,r,-2.35,-.8);x.stroke()});
x.fillStyle='#fff';x.beginPath();x.arc(120,100,3,0,P2);x.fill();
x.fillStyle='#ddd';x.beginPath();x.arc(212,48,15,0,P2);x.fill();x.beginPath();x.arc(212,86,24,Math.PI,0);x.fill();
DK.forEach(([m,c],i)=>{const a=300+i*104;rr(x,a,26,80,80,24,c);if(m.complete&&m.naturalWidth)x.drawImage(m,a+12,38,56,56)});
rr(x,716,26,80,80,24,'rgba(255,255,255,.22)');x.fillStyle='#fff';
for(let a=0;a<3;a++)for(let b=0;b<3;b++){x.beginPath();x.arc(742+a*14,52+b*14,4.2,0,P2);x.fill()}
K.t.needsUpdate=true}
drawDock();setInterval(drawDock,10000);

/* mão (menor) */
const hand=new THREE.Group();hs.add(hand);
const CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]],TIPS=[4,8,12,16,20],PALM=[0,1,5,9,13,17];
const MM=(c,o)=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,depthTest:false,depthWrite:false,side:2});
const jm=MM(0x8b7cf6,.95),tm=MM(0xffffff,1),bm=MM(0xd9d4ff,.8),pm=MM(0x8b7cf6,.25),rm=MM(0xffffff,.95);
const jp=[],tg=[],joints=[],bones=[],sgJ=new THREE.SphereGeometry(.004,10,8),sgT=new THREE.SphereGeometry(.0065,10,8);
for(let i=0;i<21;i++){jp.push(new V3());tg.push(new V3());const t=TIPS.includes(i),s=new THREE.Mesh(t?sgT:sgJ,t?tm:jm);hand.add(s);joints.push(s)}
const cg=new THREE.CylinderGeometry(.0014,.0014,1,6);
CONN.forEach(()=>{const b=new THREE.Mesh(cg,bm);hand.add(b);bones.push(b)});
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(18),3));pg.setIndex([0,1,2,0,2,3,0,3,4,0,4,5]);
const palm=new THREE.Mesh(pg,pm);palm.frustumCulled=false;hand.add(palm);
const cur=new THREE.Mesh(new THREE.RingGeometry(.011,.015,32),rm);hand.add(cur);hand.visible=false;
const ret=new THREE.Mesh(new THREE.RingGeometry(.007,.011,24),new THREE.MeshBasicMaterial({color:0xffffff}));ret.position.z=-1;hs.add(ret);

/* toast */
const TO=mk(700,110),toast=pl(.56,.088,TO.t);toast.position.set(0,.3,-.8);toast.visible=false;hs.add(toast);
let toastT=0;
function say(s){const x=TO.x;x.clearRect(0,0,700,110);x.fillStyle='rgba(20,18,26,.92)';x.beginPath();x.roundRect(0,0,700,110,55);x.fill();x.fillStyle='#fff';x.font='bold 40px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(s,350,57,640);TO.t.needsUpdate=true;toast.visible=true;toastT=performance.now()+1700}

/* giroscópio */
let haveOri=false,mode='arrastar tela',dyaw=0,dpit=0;
const ori={a:0,b:0,g:0},eu=new THREE.Euler(),q1=new THREE.Quaternion(-Math.SQRT1_2,0,0,Math.SQRT1_2),q0=new THREE.Quaternion(),zee=new V3(0,0,1),qo=new THREE.Quaternion(),qd=new THREE.Quaternion();
addEventListener('deviceorientation',e=>{if(e.alpha==null||e.beta==null)return;ori.a=e.alpha;ori.b=e.beta;ori.g=e.gamma;haveOri=true});
function devQ(){const d=Math.PI/180,o=(screen.orientation?screen.orientation.angle:(window.orientation||0))*d;
eu.set(ori.b*d,ori.a*d,-ori.g*d,'YXZ');return qd.setFromEuler(eu).multiply(q1).multiply(q0.setFromAxisAngle(zee,-o))}
function recenter(){if(haveOri){eu.setFromQuaternion(devQ(),'YXZ');qo.setFromAxisAngle(new V3(0,1,0),-eu.y)}dyaw=dpit=0}

/* toque */
let drag=null,tapT=0,tapX=0,tapY=0,carry=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};tapT=performance.now();tapX=e.clientX;tapY=e.clientY});
cv.addEventListener('pointermove',e=>{if(!drag||haveOri)return;dyaw+=(e.clientX-drag.x)*.005;dpit=Math.max(-1.4,Math.min(1.4,dpit+(e.clientY-drag.y)*.005));drag={x:e.clientX,y:e.clientY}});
cv.addEventListener('pointerup',e=>{drag=null;if(performance.now()-tapT<350&&Math.hypot(e.clientX-tapX,e.clientY-tapY)<12){if(carry){carry=null;say('Solto');return}if(!handOn&&hover){if(hover.userData.handle){carry=hover;say('Olhe para onde quer e toque')}else launch(hover)}else recenter()}});

/* câmera */
let camOn=false,camStarted=false,camState='desligada';
async function startCam(){camStarted=true;
try{video.srcObject&&video.srcObject.getTracks().forEach(t=>t.stop())}catch(e){}
const h=D.q==='4k';
try{video.srcObject=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:h?3840:1920},height:{ideal:h?2160:1080},frameRate:{ideal:30}}});await video.play();camOn=true;camState='ativa'}
catch(e){camOn=false;camState='erro: '+(e.name||e)}}

/* mediapipe */
let hands=null,busy=false,lm=null,lmT=0,handState='iniciando',dSm=0;
const SC=new THREE.Vector2(1,1),hcv=document.createElement('canvas'),hx=hcv.getContext('2d');
function initHands(){
if(typeof Hands==='undefined'){handState='MediaPipe indisponível';return}
hands=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/'+f});
hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.5});
hands.onResults(r=>{if(!r.multiHandLandmarks||!r.multiHandLandmarks.length){lm=null;dSm=0;return}lm=r.multiHandLandmarks[0];lmT=performance.now();mapHand(lm)});
handLoop()}
async function handLoop(){
if(D.hand&&camOn&&video.readyState>=2&&!busy&&video.videoWidth){busy=true;
try{hcv.width=480;hcv.height=Math.round(480*video.videoHeight/video.videoWidth);hx.drawImage(video,0,0,hcv.width,hcv.height);await hands.send({image:hcv})}catch(e){handState='erro MediaPipe'}
busy=false}
setTimeout(handLoop,12)}
function mapHand(l){
const ea=PW/2/PH,tv=Math.tan(D.fov*Math.PI/360),th=tv*ea;
const nd=l.map(p=>[(p.x-.5)*2/SC.x,-(p.y-.5)*2/SC.y]);
const ps=Math.hypot((nd[0][0]-nd[9][0])*th,(nd[0][1]-nd[9][1])*tv);
const dr=Math.min(.9,Math.max(.25,.09/Math.max(ps,.02)));
dSm=dSm?dSm+(dr-dSm)*.3:dr;
const d=dSm,zs=th*d/SC.x;
l.forEach((p,i)=>{const dd=Math.min(d*1.1,Math.max(d*.9,d+p.z*zs));tg[i].set(nd[i][0]*th*dd,nd[i][1]*tv*dd,-dd)});
const w=tg[0].clone();
for(let i=1;i<21;i++)tg[i].sub(w).multiplyScalar(D.hs).add(w);
if(!hand.visible)jp.forEach((j,i)=>j.copy(tg[i]))}

/* interação */
let handOn=false,pinch=false,fist=false,gOn=false,grab=null,hover=null,gT=0,gesto='—';
const gP=new V3(),Y=new V3(0,1,0),Z=new V3(0,0,1),tmp=new V3(),tmp2=new V3();
function nearest(gp){
const r=tmp2.copy(gp).normalize();let best=null,bd=9;
for(const g of items.concat(handles)){g.getWorldPosition(tmp);const p=head.worldToLocal(tmp),t=p.dot(r);if(t<=0)continue;
const d=p.distanceTo(r.clone().multiplyScalar(t));if(d<g.userData.r&&d<bd){bd=d;best=g}}
return best}
function launch(g){if(g.userData.handle)return;say('Abrindo '+g.userData.name+'…');g.userData.pulse=performance.now()}
function interact(now){
if(handOn){
const pw=jp[0].distanceTo(jp[9])||.05,pd=jp[4].distanceTo(jp[8])/pw,
fd=[8,12,16,20].reduce((a,i)=>a+jp[i].distanceTo(jp[0]),0)/4/pw;
pinch=pinch?pd<.45:pd<.28;fist=fist?fd<1.5:fd<1.15;
const gp=pinch?tmp.copy(jp[4]).add(jp[8]).multiplyScalar(.5).clone():fist?jp[9].clone():jp[8].clone();
gesto=pinch?'pinça':fist?'punho':'aberta';
hover=grab||nearest(gp);
const want=pinch||fist;
if(want&&!gOn){gOn=true;if(hover){grab=hover;gT=now;gP.copy(grab.position);grab.userData.dist=head.worldToLocal(grab.getWorldPosition(new V3())).length()}}
if(!want&&gOn){gOn=false;if(grab){if(now-gT<350&&grab.position.distanceTo(gP)<.06)launch(grab);grab=null}}
if(grab&&!grab.userData.handle)grab.position.lerp(grab.parent.worldToLocal(head.localToWorld(gp.clone().normalize().multiplyScalar(grab.userData.dist))),.5);
const c=pinch?0x5be07a:fist?0xffb347:0x8b7cf6;
jm.color.setHex(c);pm.color.setHex(c);rm.color.setHex(pinch?0x5be07a:fist?0xffb347:0xffffff);
tm.color.setHex(pinch?0xd8ffe3:fist?0xffe3b8:0xffffff);
cur.position.copy(gp);cur.quaternion.setFromUnitVectors(Z,tmp.copy(gp).negate().normalize());
cur.scale.setScalar((grab?.7:hover?1.35:1)*Math.max(.6,gp.length()/.45))
}else{gOn=false;grab=null;pinch=fist=false;gesto='—';hover=nearest(new V3(0,0,-1))}
items.forEach(g=>{const u=g.userData;let s=g===grab?1.12:g===hover?1.05:1;
if(u.pulse){const p=(now-u.pulse)/450;if(p<1)s+=Math.sin(p*Math.PI)*.15;else u.pulse=0}
u.s+=(s-u.s)*.25;g.scale.setScalar(u.s);const o=g===grab?.95:g===hover?.7:0;u.gl.material.opacity+=(o-u.gl.material.opacity)*.3});
handles.forEach(h=>{const u=h.userData,t=h===grab||h===carry?1.5:h===hover?1.25:1;u.s+=(t-u.s)*.25;h.scale.set(u.s,u.s,1);h.material.opacity+=((h===grab||h===carry||h===hover?1:.55)-h.material.opacity)*.3});
ret.visible=!handOn}

/* loop */
let fps=0,fc=0,ft=performance.now(),run=false;const diag=$('#diag');
function frame(now){
requestAnimationFrame(frame);if(!run)return;fc++;
if(now-ft>500){fps=Math.round(fc*1000/(now-ft));fc=0;ft=now;diag.style.display=D.diag?'block':'none';
if(D.diag)diag.textContent='FPS '+fps+'\nCâmera: '+camState+(camOn?' '+video.videoWidth+'x'+video.videoHeight:'')+'\nCabeça: '+mode+'\nMão: '+(!D.hand?'desligada':handOn?gesto:hands?'não detectada':handState)}
if(haveOri){head.quaternion.copy(qo).multiply(devQ());mode='giroscópio'}
else{head.rotation.set(dpit,dyaw,0,'YXZ');mode='arrastar tela'}
head.updateMatrixWorld(true);
const ea=PW/2/PH;
if(video.videoWidth){const va=video.videoWidth/video.videoHeight;SC.set(Math.min(1,ea/va),Math.min(1,va/ea));bgM.uniforms.s.value.copy(SC)}
handOn=!!(D.hand&&lm&&now-lmT<350);hand.visible=handOn;
if(handOn){
jp.forEach((j,i)=>{j.lerp(tg[i],.5);joints[i].position.copy(j)});
CONN.forEach(([a,b],i)=>{const A=jp[a],B=jp[b],m=bones[i];m.position.copy(A).add(B).multiplyScalar(.5);tmp.copy(B).sub(A);m.scale.y=Math.max(tmp.length(),1e-4);m.quaternion.setFromUnitVectors(Y,tmp.normalize())});
const pa=pg.attributes.position;PALM.forEach((k,i)=>pa.setXYZ(i,jp[k].x,jp[k].y,jp[k].z));pa.needsUpdate=true}
interact(now);
const mh=grab&&grab.userData.handle?grab:carry;
if(mh){const w=mh.userData.win,dir=new V3(0,0,-1).applyQuaternion(head.quaternion),dd=w.userData.d||(w.userData.d=w.position.length());
dir.multiplyScalar(dd).y-=mh.position.y;w.position.lerp(dir,.15);w.lookAt(0,0,0)}
if(toast.visible&&now>toastT)toast.visible=false;
draw()}
function draw(){
const ea=PW/2/PH,w=PW>>1;
E[0].position.x=-D.ipd/2000;E[1].position.x=D.ipd/2000;
[E[0],E[1],HC].forEach(c=>{c.fov=D.fov;c.aspect=ea;c.updateProjectionMatrix()});
dm.uniforms.k.value.set(D.k1,D.k2);dm.uniforms.sep.value=D.sep;dm.uniforms.asp.value=ea;
R.setRenderTarget(rt);R.setScissorTest(false);R.setViewport(0,0,PW,PH);R.setClearColor(0,1);R.clear();R.setScissorTest(true);
for(let e=0;e<2;e++){const ew=e*w;R.setViewport(ew,0,w,PH);R.setScissor(ew,0,w,PH);
if(camOn)R.render(bgS,bgC);
R.clearDepth();R.render(scene,E[e]);R.clearDepth();R.render(hs,HC)}
R.setRenderTarget(null);R.setScissorTest(false);R.setViewport(0,0,PW,PH);R.clear();R.render(ds,bgC)}
requestAnimationFrame(frame);

/* botões */
$('#gear').onclick=()=>{$('#menu').classList.remove('off');run=false};
$('#rc').onclick=recenter;$('#rs').onclick=resetItems;
$('#go').onclick=async()=>{
try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)await DeviceOrientationEvent.requestPermission()}catch(e){}
try{await document.documentElement.requestFullscreen()}catch(e){}
try{await screen.orientation.lock('landscape')}catch(e){}
try{navigator.wakeLock&&await navigator.wakeLock.request('screen')}catch(e){}
$('#menu').classList.add('off');
if(!camStarted)await startCam();
if(!hands&&!window._hi){window._hi=1;initHands()}
setTimeout(()=>{resize();recenter();run=true},400)};
</script></body></html>
